# config_probe_sam3d.yaml
# SAM-Med3D vit_b_ori — OFC (4-class), FIP (binary), SC (6D regression)
#
# Usage:
#   python scripts/run_probe.py --config configs/config_probe_sam3d.yaml
#   python scripts/run_probe.py --config configs/config_probe_sam3d.yaml
#   python scripts/run_probe.py  --config configs/config_probe_sam3d.yaml
#
# Preprocessing: native SAM-Med3D (hardcoded in extract_features.py)
#   tio.ZNormalization(masking_method=lambda x: x > 0)
#   → mean/std computed on non-zero voxels only
#   → (x - mean) / std applied to the full volume
#   No resize needed: window128 is already at 128³.

# =============================================================================
# Model identity
# =============================================================================
experiment:
  model: "sam3d"

# =============================================================================
# Repository — added to sys.path for `from segment_anything.* import ...`
# =============================================================================
repositories:
  sam3d: "/path/to/SAM-Med3D/"

# =============================================================================
# Paths
# =============================================================================
paths:
  checkpoint_path: "/path/to/SAM-Med3D/ckpt/sam_med3d_turbo.pth"
  output_root:     "/path/to/outputs"

# =============================================================================
# Feature extraction
# SAM-Med3D is heavier than 3DINO — keep batch_size=1
# =============================================================================
feature_extraction:
  batch_size: 1
  device:     "cuda"

# =============================================================================
# ROI-specific settings
# =============================================================================
rois:

  ofc:
    task_type:    "classification"
    n_classes:    4
    crop_dir:     "/path/to/mri_preproc_hcp/crop_mni09c_1mm"
    roi_dirname:  "OFC"
    master_table: "/path/to/data/ofc_hcp/master_table_ofc.csv"

  fip:
    task_type:    "classification"
    n_classes:    2
    crop_dir:     "/path/to/mri_preproc_hcp/crop_mni09c_1mm"
    roi_dirname:  "FIP"
    master_table: "/path/to/data/fip_hcp/master_table_fip.csv"

  sc:
    task_type:    "regression"
    n_classes:    null
    crop_dir:     "/path/to/mri_preproc_hcp/crop_mni09c_1mm"
    roi_dirname:  "Central"
    master_table: "/path/to/data/sc_hcp/master_table_sc.csv"

# =============================================================================
# Probe hyperparameters
# =============================================================================
probe:
  n_folds: 5

  # LogisticRegression L2 — mean_pool / mean_pool_multi_layers
  C: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

  # Ridge regression — SC (all modes)
  alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0, 1000000.0]

  # RidgeClassifier / Ridge — flatten (D >> N regime)
  # SAM-Med3D flatten dim = 384 × 512 = 196,608
  flatten_raw_alpha: [1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0, 1000000.0]

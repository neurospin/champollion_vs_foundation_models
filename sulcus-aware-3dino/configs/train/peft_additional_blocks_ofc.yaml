# dinov2/configs/train/peft_additional_blocks_ofc.yaml
#
# Override partiel sur ssl3d_default_config.yaml pour l'entraînement
# avec blocs additionnels (Additional Blocks PEFT) sulcal OFC.
# Ne contient QUE les différences par rapport à la config de base.
#
# Config finale résolue au lancement :
#   merge(ssl3d_default_config, peft_additional_blocks_ofc, cli_overrides)
#
# Lancement :
#   python dinov2/train/train3d.py \
#       --config-file train/peft_additional_blocks_ofc \
#       --output-dir ./output_additional_blocks_ofc

student:
  pretrained_weights: "/path/to/weights/3dino_vit_weights.pth"
  full_pretrained_weights: ""

peft:
  enable: true
  method: additional_blocks
  n_blocks: 2

train:
  dataset_path: "data/pretrain_sulcal_datalist.json"

  affine_prob_global: 1.0
  translate_range_global: [1, 1, 1]
  rotate_range_global: [0.314159, 0.314159, 0.314159] # ± 18°


  affine_prob_local: 1.0
  translate_range_local: [1, 1, 1]
  rotate_range_local: [0.314159, 0.314159, 0.314159] # ± 18°

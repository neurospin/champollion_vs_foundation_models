MODEL:
  WEIGHTS: ''

compute_precision:
  grad_scaler: true
  teacher:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32

dino:
  loss_weight: 1.0
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
    - 0.2
    - 0.75
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

train:
  saveckp_period_iterations: 3750
  max_to_keep: 3
  batch_size_per_gpu: 128

  # ── Dataset input mode ──────────────────────────────────────────────────
  # dataset_format: only "npy_array" is supported. dataset_path points to one
  #   large raw .npy array of shape [N, D, H, W] or [N, D, H, W, 1]; samples are
  #   indexed internally along the first dimension.
  dataset_format: "npy_array"
  dataset_path: "/path/to/dataset.npy"

  # ── Single large .npy options ───────────────────────────────────────────
  # npy_mmap_mode:
  #   Use "r" to memory-map the large .npy without loading it fully in RAM.
  #
  # npy_input_layout:
  #   - auto  : accept [N,D,H,W] or [N,D,H,W,1]
  #   - NDHW  : require [N,D,H,W]
  #   - NDHW1 : require [N,D,H,W,1]
  #
  # preprocess_target_size:
  #   Final cubic size after isotropic upscale + centered padding.
  #   For 3DINO-ViT with crops.global_crops_size=112, this must be 112.
  #
  # binarize_nonzero:
  #   If true, raw input values are binarized with x != 0 before resizing.
  npy_mmap_mode: "r"
  npy_input_layout: "auto"
  preprocess_target_size: 112
  binarize_nonzero: true

  output_dir: ./output_test
  seed: 0
  num_workers: 32
  OFFICIAL_EPOCH_LENGTH: 1250
  centering: sinkhorn_knopp

  # ── Sulcal SSL augmentation pipeline ────────────────────────────────────
  affine_prob_global: 1.0
  translate_range_global: [1, 1, 1]
  rotate_range_global: [0.314159, 0.314159, 0.314159]
  affine_prob_local: 1.0
  translate_range_local: [1, 1, 1]
  rotate_range_local: [0.314159, 0.314159, 0.314159]

  # ── Masking strategy ────────────────────────────────────────────────────
  # use_non_empty_masking:
  #   If true, iBOT masks are restricted to patches containing at least one
  #   active sulcal voxel. This avoids masking pure background patches.
  #
  # Set to true  for sulcus-aware pipeline.
  # Set to false for native/uniform 3DINO masking.
  use_non_empty_masking: true

student:
  arch: vit_large_3d
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  full_pretrained_weights: ''
  ffn_layer: "mlp"
  block_chunks: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30

optim:
  epochs: 100
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.002  # learning rate for a batch size of 1024
  lr: 0.          # will be set after applying scaling rule
  warmup_epochs: 10
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  local_crops_number: 8
  global_crops_size: 112
  local_crops_size: 64

evaluation:
  eval_period_iterations: 12500

peft:
  enable: false
  method: lora
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules:
    - "qkv"
